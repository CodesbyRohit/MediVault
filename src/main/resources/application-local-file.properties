# ---------------------------------------------------------------------------
# Profile "local-file": persistent local development without MySQL.
# Activate explicitly only:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local-file"
#
# Everything lives under one private storage root (outside the project, the JAR and any
# static-resource location):
#   <root>\data\      file-backed H2 database (medivault.mv.db)
#   <root>\records\   uploaded PDFs, stored under random UUID names
# The root is MEDIVAULT_STORAGE_ROOT if set, otherwise %LOCALAPPDATA%\MediVault.
#
# - Data survives restarts. Nothing is dropped or recreated at startup: Flyway applies the
#   versioned H2 migrations (db/migration/h2) and Hibernate only validates the schema.
# - DatabaseSafetyGuard refuses to start unless the database is exactly <root>\data\<name>,
#   PDFs go to <root>\records, only allow-listed H2 settings are used, and the schema rules
#   above hold. A SPRING_DATASOURCE_URL variable pointing anywhere else is refused.
# - New accounts start empty. Demo records are never created here, even with "demo" (that profile
#   only seeds the disposable "local-h2" database, and logs a warning otherwise).
# - Not for production use, and files are NOT encrypted (see README).
# ---------------------------------------------------------------------------
medivault.storage.root=${MEDIVAULT_STORAGE_ROOT:${LOCALAPPDATA}/MediVault}

spring.datasource.url=jdbc:h2:file:${medivault.storage.root}/data/medivault;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

medivault.documents.directory=${medivault.storage.root}/records

# --- Flyway: versioned H2 migrations; never clean, never baseline ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.fail-on-missing-locations=true

# --- Hibernate only validates the schema that Flyway created; it never changes it ---
spring.jpa.hibernate.ddl-auto=validate

# Keep the H2 web console off (DevTools would otherwise enable it).
spring.h2.console.enabled=false

# Local development only: reachable from this computer only, and no LiveReload server.
server.address=127.0.0.1
spring.devtools.livereload.enabled=false

# Flyway and HikariCP log the JDBC URL, which contains the local storage path. Never log it.
logging.level.org.flywaydb.core.FlywayExecutor=WARN
logging.level.com.zaxxer.hikari.pool.HikariPool=WARN
