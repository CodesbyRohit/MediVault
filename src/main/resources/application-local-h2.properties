# ---------------------------------------------------------------------------
# Profile "local-h2": run the UI locally before MySQL 8.x is available.
# Activate explicitly only:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local-h2"
#
# - In-memory database: all data is lost when the application stops; nothing is written to disk.
# - Environment variables take precedence over this file. If a SPRING_DATASOURCE_URL variable
#   points anywhere other than an in-memory H2 database (jdbc:h2:mem:), the app REFUSES TO START
#   with this profile instead of connecting to that database (e.g. MySQL). Clear the
#   SPRING_DATASOURCE_* variables before using this profile (see README).
#   DB_URL / DB_USERNAME / DB_PASSWORD are ignored by this profile.
# - Optional fictional demo records require BOTH profiles: "local-h2,demo".
# - Not for production use. H2 is refused at startup unless "local-h2" (or "test") is active.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:medivault_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Keep the H2 web console off (DevTools would otherwise enable it).
spring.h2.console.enabled=false
