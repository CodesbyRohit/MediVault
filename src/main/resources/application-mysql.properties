# ---------------------------------------------------------------------------
# Profile "mysql": isolated MySQL 8.4 instance (Milestone 2).
# Activate explicitly:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
#
# All values come from environment variables; there are NO defaults, so a missing
# variable stops startup. Never put real values or passwords in this file or in DB_URL.
#   DB_URL                 jdbc:mysql://127.0.0.1:<port>/medivault_dev?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:/...&trustCertificateKeyStoreType=PKCS12
#   DB_USERNAME            medivault_dev_app        (data access only)
#   DB_PASSWORD
#   DB_MIGRATION_USERNAME  medivault_dev_migrator   (Flyway schema changes only)
#   DB_MIGRATION_PASSWORD
# DatabaseSafetyGuard validates all of this before any connection is attempted
# (host 127.0.0.1 only, explicit port never 3306, sslMode VERIFY_CA/VERIFY_IDENTITY,
# allow-listed parameters, no credentials in the URL, account/database pairing).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Flyway: versioned migrations, run with the separate migration account ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.user=${DB_MIGRATION_USERNAME}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.fail-on-missing-locations=true

# --- Hibernate only validates the schema that Flyway created; it never changes it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Uploaded PDFs (not verified with MySQL yet). Kept apart from the local-file profile's records.
medivault.documents.directory=${MEDIVAULT_STORAGE_ROOT:${LOCALAPPDATA}/MediVault}/mysql-records

# Flyway logs the (credential-redacted) JDBC URL at INFO; never log JDBC URLs.
logging.level.org.flywaydb.core.FlywayExecutor=WARN
