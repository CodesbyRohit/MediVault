# ---------------------------------------------------------------------------
# Profile "railway": hosted demo on Railway (Stage 1, FICTIONAL DATA ONLY).
# Activate exactly as:  SPRING_PROFILES_ACTIVE=local-file,railway
#
# - "local-file" provides the storage: the file-backed H2 database and the encrypted PDFs under
#   MEDIVAULT_STORAGE_ROOT, which must be on the service's persistent volume (the container's own
#   disk is lost on every redeploy). All local-file rules (DatabaseSafetyGuard) still apply.
# - This file only changes how the server is reached. It must be listed AFTER "local-file" so its
#   settings win over local-file's loopback-only server.address.
# - HostedProfileGuard refuses to start if "local-file" is missing or listed after "railway", if
#   "demo" is active, or if the session-cookie or forwarded-header settings below are changed.
# ---------------------------------------------------------------------------

# Railway sends traffic to the container's network interface, on the port it passes in PORT.
server.address=0.0.0.0
server.port=${PORT:8080}

# HTTPS ends at Railway's proxy, which forwards plain HTTP with X-Forwarded-* headers. Tomcat's
# RemoteIpValve applies them only to requests from internal (private-range) proxy addresses; the
# request is then treated as HTTPS (HSTS header, https redirects). The session cookie is always
# marked Secure, whatever the request looked like.
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
