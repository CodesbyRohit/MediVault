spring.application.name=medivault

# Spring Boot's startup-info lines name the Windows user, the PID and the project/JAR path
# ("Starting ... started by <user> in <folder>"). They are not needed, so they are switched off in
# every profile. This also hides "The following profiles are active" and "Started ... in N seconds";
# "Tomcat started on port ..." still shows that the app is ready.
spring.main.log-startup-info=false

# Handled request errors (404, 400, ...). Spring's own "Resolved [...]" warnings repeat request-controlled
# text (a malformed ID, the requested path, a header value). DefaultHandlerExceptionResolver logs them in
# every profile and DevTools switches them on for the other resolvers, so all of them are turned off here,
# together with Spring's raw-URI "PageNotFound" category. RejectedRequestLogger logs one sanitised line
# per handled error instead (exception type, route template, never request values).
spring.mvc.log-resolved-exception=false
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
medivault.web.log-rejected-requests=true

# ---------------------------------------------------------------------------
# Database
# No datasource is configured here on purpose. Exactly one database profile must be
# chosen explicitly, otherwise DatabaseSafetyGuard refuses to start:
#   local-h2    in-memory H2 demo; data is lost on restart (application-local-h2.properties)
#   local-file  persistent file-backed H2 + private PDF folder (application-local-file.properties)
#   mysql       isolated MySQL 8.4 on 127.0.0.1 via environment variables
#             (application-mysql.properties; Flyway migrations + Hibernate validate)
# The application can therefore never fall back to an unrelated server; port 3306
# (the default MySQL port) is always refused.
# ---------------------------------------------------------------------------
spring.flyway.enabled=false

# ---------------------------------------------------------------------------
# JPA / Hibernate (ddl-auto is set per profile; never "update")
# ---------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Web / session
# ---------------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Never leak internals on error pages (DevTools would otherwise turn these on).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
# Keep the H2 web console off in every profile (DevTools would otherwise enable it during local runs).
spring.h2.console.enabled=false

# ---------------------------------------------------------------------------
# PDF documents. medivault.documents.directory is set by each database profile: an absolute
# folder outside the application and outside every static-resource location. PDFs are
# streamed to that folder, never stored in the database and never served as static files.
# The multipart limit matches the application limit so oversized uploads are refused early.
# ---------------------------------------------------------------------------
medivault.documents.max-size=10MB
spring.servlet.multipart.max-file-size=${medivault.documents.max-size}
spring.servlet.multipart.max-request-size=11MB

# ---------------------------------------------------------------------------
# Optional admin bootstrap (see README). Set BOTH as environment variables:
#   MEDIVAULT_ADMIN_EMAIL, MEDIVAULT_ADMIN_PASSWORD
# Never put real values in this file.
# ---------------------------------------------------------------------------
medivault.admin.email=${MEDIVAULT_ADMIN_EMAIL:}
medivault.admin.password=${MEDIVAULT_ADMIN_PASSWORD:}
