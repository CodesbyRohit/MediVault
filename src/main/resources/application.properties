spring.application.name=medivault

# ---------------------------------------------------------------------------
# Database
# No datasource is configured here on purpose. Exactly one database profile must be
# chosen explicitly, otherwise DatabaseSafetyGuard refuses to start:
#   local-h2  in-memory H2 demo (application-local-h2.properties)
#   mysql     isolated MySQL 8.4 on 127.0.0.1 via environment variables
#             (application-mysql.properties; Flyway migrations + Hibernate validate)
# The application can therefore never fall back to an unrelated server; port 3306
# (the default MySQL port) is always refused.
# ---------------------------------------------------------------------------
spring.flyway.enabled=false

# ---------------------------------------------------------------------------
# JPA / Hibernate (ddl-auto is set per profile; never "update")
# ---------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Web / session
# ---------------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Never leak internals on error pages (DevTools would otherwise turn these on).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
# Keep the H2 web console off in every profile (DevTools would otherwise enable it during local runs).
spring.h2.console.enabled=false

# ---------------------------------------------------------------------------
# Optional admin bootstrap (see README). Set BOTH as environment variables:
#   MEDIVAULT_ADMIN_EMAIL, MEDIVAULT_ADMIN_PASSWORD
# Never put real values in this file.
# ---------------------------------------------------------------------------
medivault.admin.email=${MEDIVAULT_ADMIN_EMAIL:}
medivault.admin.password=${MEDIVAULT_ADMIN_PASSWORD:}
