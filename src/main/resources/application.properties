spring.application.name=medivault

# ---------------------------------------------------------------------------
# Database (MySQL 8.x)
# Real values come from environment variables. Never commit a real password.
#   DB_URL       e.g. jdbc:mysql://localhost:3306/medivault
#   DB_USERNAME  e.g. medivault
#   DB_PASSWORD  (no default on purpose)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medivault}
spring.datasource.username=${DB_USERNAME:medivault}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
