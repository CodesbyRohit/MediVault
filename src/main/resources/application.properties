spring.application.name=medivault

# ---------------------------------------------------------------------------
# Database (MySQL 8.x)
# Real values come from environment variables. Never commit a real password.
#   DB_URL       REQUIRED, no default: jdbc:mysql://localhost:<mysql8-port>/medivault
#                (must point at an isolated MySQL 8.x instance on an explicitly chosen port)
#   DB_USERNAME  e.g. medivault
#   DB_PASSWORD  (no default on purpose)
# Without DB_URL the application refuses to start, so it can never fall back to an
# unrelated server (on the author's machine, port 3306 is an existing MySQL 5.5 service).
# The "local-h2" profile and the tests set their own URL and do not need DB_URL.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:medivault}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Web / session
# ---------------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Never leak internals on error pages (DevTools would otherwise turn these on).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
# Keep the H2 web console off in every profile (DevTools would otherwise enable it during local runs).
spring.h2.console.enabled=false

# ---------------------------------------------------------------------------
# Optional admin bootstrap (see README). Set BOTH as environment variables:
#   MEDIVAULT_ADMIN_EMAIL, MEDIVAULT_ADMIN_PASSWORD
# Never put real values in this file.
# ---------------------------------------------------------------------------
medivault.admin.email=${MEDIVAULT_ADMIN_EMAIL:}
medivault.admin.password=${MEDIVAULT_ADMIN_PASSWORD:}
