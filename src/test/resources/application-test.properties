# Test profile: in-memory H2 (MySQL compatibility mode) so tests never touch a real database.
# Test classes also load this file via @TestPropertySource, which takes precedence over
# SPRING_DATASOURCE_* environment variables.
spring.datasource.url=jdbc:h2:mem:medivault_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# H2 tests use Hibernate create-drop; MySQL-specific Flyway migrations are verified by the
# opt-in MySQL 8.4 tests (com.medivault.mysql), never against H2. The H2 migrations used by
# the local-file profile are verified by LocalFileProfileTests.
spring.flyway.enabled=false
# Uploaded test PDFs go to the build directory, never to %LOCALAPPDATA%\MediVault.
medivault.documents.directory=${user.dir}/target/test-storage/records
# Tests share that folder across classes; DocumentReconciliationTests runs the check explicitly.
medivault.documents.reconcile-on-startup=false
